# MedLevo CI (track F5, §58): every push and pull request runs the same gates as a local `npm run typecheck`,
# `npm run lint`, `npm test` and `npm run build`. The browser (Playwright) suite is an OPTIONAL job: it starts real
# servers and processes real uploads (tens of minutes), so it runs only when asked for (manual run with e2e = true).
# PL-0: the container image Render builds from the Dockerfile can be built and smoke-tested here too (manual run with
# docker = true): build, start with a fresh volume, health, setup token enforced, restart, data still there.
# AOS-23.2: the performance gate (perf job) runs the MEDLEVO_PERF suites and compares their medians with
# docs/perf/baseline.json (on every push to cloudflare, or a manual run with perf = true).
# No AI key is used anywhere: AI-gated features are tested with the test-only scripted providers, and the real
# server reports them as requiring configuration.
name: CI

on:
  push:
    branches: [main, cloudflare, staging]
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: 'Also run the Playwright end-to-end suite (phone + desktop)'
        type: boolean
        default: false
      e2e_spec:
        description: 'Optional spec file(s) for the e2e job, e.g. e2e/smoke.spec.ts (empty = the whole suite)'
        type: string
        default: ''
      docker:
        description: 'Also build the Docker image (the one Render deploys) and smoke-test it'
        type: boolean
        default: false
      perf:
        description: 'Also run the performance gate (AOS-23.2: server + browser perf suites vs docs/perf/baseline.json)'
        type: boolean
        default: false
      perf_runs:
        description: 'Server perf suite runs for the medians (perf job)'
        type: number
        default: 3

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # the cloudflare branch runs the full suite (E2E + image) on every push: never cancel one half-way
  cancel-in-progress: ${{ github.ref != 'refs/heads/cloudflare' && github.ref != 'refs/heads/staging' }}

env:
  # node:sqlite is still flagged experimental in Node 22; the warning is noise in test logs
  NODE_OPTIONS: --disable-warning=ExperimentalWarning
  # never reach a real model provider from CI
  ANTHROPIC_API_KEY: ''

jobs:
  checks:
    name: typecheck · lint · unit tests · web build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # for tools/smoke/process-in-image.mjs (fetch, FormData, getSetCookie)
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # poppler renders PDF pages (OCR input, page images); openssl makes the TLS reverse-proxy test's certificate.
      # LibreOffice is not installed: the legacy .doc / .ppt tests skip themselves with a reason without it.
      - name: System tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends poppler-utils openssl

      - run: npm ci

      - name: Typecheck (shared, server, web, e2e)
        run: npm run typecheck

      - name: Lint (zero warnings)
        run: npm run lint

      - name: Unit tests — shared
        run: npm test -w @medlevo/shared

      - name: Unit tests — server
        run: npm test -w @medlevo/server

      - name: Unit tests — web
        run: npm test -w @medlevo/web

      - name: Web build (PWA)
        run: npm run build -w @medlevo/web

      # exit 4 = a regression-set case that passed in the baseline does not pass now; exit 6 = not comparable (the regression
      # set changed — re-write docs/eval/baseline.* in the same reviewed change — or baseline-passed cases were not run)
      - name: Evaluation (regression set, scripted provider; fails on a regression or when not comparable with the committed baseline)
        run: npm run eval -- --set=regression --compare=docs/eval/baseline.json --no-record --out=eval-reports

      - name: Keep the evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-reports/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: end-to-end (Playwright, phone + desktop)
    if: (github.event_name == 'workflow_dispatch' && inputs.e2e) || (github.event_name == 'push' && (github.ref == 'refs/heads/cloudflare' || github.ref == 'refs/heads/staging'))
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: System tools
        run: |
          sudo apt-get update -q
          # LibreOffice as in the production image (Dockerfile): the PPTX / legacy-DOC specs need the fixed rendering
          sudo apt-get install -y -q --no-install-recommends poppler-utils fonts-noto-core libreoffice-writer-nogui libreoffice-impress-nogui

      - run: npm ci

      # On a CI runner the browser has to be downloaded; playwright.config.ts reads its path from PW_CHROMIUM_PATH
      # (locally the preinstalled /opt/pw-browsers/chromium is used and nothing is downloaded).
      - name: Chromium for Playwright
        run: |
          npx playwright install --with-deps chromium
          echo "PW_CHROMIUM_PATH=$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" >> "$GITHUB_ENV"

      - name: Playwright
        env:
          CI: '1'
          E2E_BUILD: '1'
          # passed through the environment (never interpolated into the script); unquoted on purpose: several files
          E2E_SPEC: ${{ inputs.e2e_spec }}
        run: npx playwright test $E2E_SPEC

      - name: Keep the Playwright report and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            e2e/.artifacts/
          if-no-files-found: ignore
          retention-days: 14

  docker:
    name: docker image (build + smoke test)
    if: (github.event_name == 'workflow_dispatch' && inputs.docker) || (github.event_name == 'push' && (github.ref == 'refs/heads/cloudflare' || github.ref == 'refs/heads/staging'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build the image (the same Dockerfile Render builds)
        run: docker build --progress=plain -t medlevo:ci .

      - name: Image size and tools
        run: |
          docker image ls medlevo:ci
          docker run --rm --entrypoint sh medlevo:ci -c 'id node && node --version && pdftoppm -v 2>&1 | head -1 && soffice --version && fc-list :lang=ar family | sort -u | head -20'

      - name: Smoke test — health, setup token, persistence across a restart
        env:
          SETUP_TOKEN: ci-setup-token-not-a-secret-0123456789
        run: |
          set -eu
          docker volume create medlevo-ci-data
          start() {
            docker run -d --name medlevo-ci -p 127.0.0.1:10000:10000 -v medlevo-ci-data:/var/data \
              -e MEDLEVO_ORIGIN=http://127.0.0.1:10000 -e MEDLEVO_SETUP_TOKEN="$SETUP_TOKEN" medlevo:ci
            for i in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:10000/api/health >/dev/null 2>&1; then return 0; fi
              sleep 2
            done
            docker logs medlevo-ci; return 1
          }
          start
          curl -fsS http://127.0.0.1:10000/api/health
          curl -fsS http://127.0.0.1:10000/api/auth/status | grep -q '"setup_token_required":true'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:10000/api/auth/setup \
            -H 'content-type: application/json' -H 'x-medlevo-csrf: 1' -H 'origin: http://127.0.0.1:10000' \
            -d '{"username":"owner","password":"ci-password-12345"}')
          test "$code" = 403
          curl -fsS -X POST http://127.0.0.1:10000/api/auth/setup \
            -H 'content-type: application/json' -H 'x-medlevo-csrf: 1' -H 'origin: http://127.0.0.1:10000' \
            -d "{\"username\":\"owner\",\"password\":\"ci-password-12345\",\"setup_token\":\"$SETUP_TOKEN\"}" >/dev/null
          docker stop -t 30 medlevo-ci && docker rm medlevo-ci
          start
          curl -fsS http://127.0.0.1:10000/api/auth/status | grep -q '"setup_required":false'
          docker exec medlevo-ci sh -c 'ls -ld /var/data/medlevo && stat -c %U /var/data/medlevo/system.sqlite'
          # real lectures processed INSIDE the production image (poppler, OCR models, fonts, permissions): the outcome of
          # each is a public annotation; a «failed» processing fails this job (and the server log is printed)
          node tools/smoke/process-in-image.mjs http://127.0.0.1:10000 owner ci-password-12345 || { docker logs medlevo-ci 2>&1 | grep -iE 'fail|error|warn|"level":(40|50)' | tail -60 | sed 's/^/::warning::/'; docker stop -t 30 medlevo-ci; exit 1; }
          docker stop -t 30 medlevo-ci

  # PRD AOS-23.2 performance gate: the MEDLEVO_PERF suites (server: apps/server/test/perf, PERF_RUNS runs → medians;
  # browser: e2e/perf.spec.ts, desktop project, one run), compared with docs/perf/baseline.json by tools/perf/compare.mjs
  # (fails on a median > 10 % worse than the baseline unless docs/perf/accepted-regressions.json lists it with a reason;
  # while the baseline is provisional — seeded from the GATE-1 VM numbers, not GitHub hardware — it only reports).
  # The raw results, the medians and a baseline re-recorded from this run (baseline.candidate.json) are uploaded as the
  # perf-results artifact: copy that candidate to docs/perf/baseline.json after reviewing it to arm the gate.
  perf:
    name: performance gate (AOS-23.2)
    if: (github.event_name == 'workflow_dispatch' && inputs.perf) || (github.event_name == 'push' && (github.ref == 'refs/heads/cloudflare' || github.ref == 'refs/heads/staging'))
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      # the flag every perf file needs (apps/server/test/perf/fixtures.ts, e2e/perf.spec.ts); without it they skip
      MEDLEVO_PERF: '1'
      # pushes have no inputs: 3 runs
      PERF_RUNS: ${{ inputs.perf_runs || 3 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # poppler renders PDF pages; the Noto fonts let Chromium shape the Arabic text of the generated fixtures
      - name: System tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends poppler-utils fonts-noto-core

      - run: npm ci

      - name: Comparator self-test
        run: node --test tools/perf/compare.test.mjs

      # the same browser setup as the e2e job: the fixtures are printed by Chromium (PW_CHROMIUM_PATH), and the browser
      # suite drives it
      - name: Chromium for Playwright
        run: |
          npx playwright install --with-deps chromium
          echo "PW_CHROMIUM_PATH=$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" >> "$GITHUB_ENV"
          # the generated fixtures (300-page lecture, question bank, scans …) are built once and shared by every run
          echo "MEDLEVO_PERF_CACHE=$RUNNER_TEMP/medlevo-perf-fixtures" >> "$GITHUB_ENV"

      # one scenario per file, files one after another (each file its own process: memory high-water marks per scenario)
      - name: Server perf suites (${{ env.PERF_RUNS }} runs)
        working-directory: apps/server
        run: |
          set -eu
          for i in $(seq 1 "$PERF_RUNS"); do
            echo "::group::server perf run $i of $PERF_RUNS"
            MEDLEVO_PERF_OUT="$GITHUB_WORKSPACE/perf-results/server-$i" npx vitest run test/perf --no-file-parallelism
            echo "::endgroup::"
          done

      - name: Browser perf suite (desktop Chromium)
        if: ${{ !cancelled() }}
        env:
          CI: '1'
          E2E_BUILD: '1'
        run: |
          npx playwright test e2e/perf.spec.ts --project=desktop
          mkdir -p perf-results/browser
          cp e2e/.artifacts/perf/desktop.json perf-results/browser/

      # exit 1 = a median > threshold worse than the baseline (not accepted) or a tracked metric missing; 0 while provisional
      - name: Compare with the baseline
        if: ${{ !cancelled() }}
        run: |
          node tools/perf/compare.mjs --runs-root perf-results --out perf-results/medians.json --summary "$GITHUB_STEP_SUMMARY"

      - name: Candidate baseline from this run (to record after review)
        if: ${{ !cancelled() }}
        run: |
          cp docs/perf/baseline.json perf-results/baseline.candidate.json
          node tools/perf/compare.mjs --runs-root perf-results --baseline perf-results/baseline.candidate.json --record

      - name: Keep the perf results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: |
            perf-results/
            e2e/.artifacts/perf/
          if-no-files-found: ignore
          retention-days: 30
